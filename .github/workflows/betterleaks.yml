# Second line behind .githooks/pre-commit, which a clone may not have enabled
# or may skip (--no-verify): scans the whole history for tokens and keys on
# every push and pull request. Values are redacted in the log; reviewed false
# positives are listed in .betterleaksignore.
# New betterleaks version: bump it in both places of the URL and take the
# tarball's sha256 from the release's signed checksums.txt.
name: betterleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install betterleaks 1.10.0 (checksum verified)
        run: |
          curl -sSfL -o betterleaks.tgz https://github.com/betterleaks/betterleaks/releases/download/v1.10.0/betterleaks_1.10.0_linux_x64.tar.gz
          echo "9d9ad503cd5d80d18a939352266c3fcca52f10da9b83cd5cfe646989b13940fe  betterleaks.tgz" | sha256sum -c -
          tar -xzf betterleaks.tgz betterleaks

      - name: Scan the history
        run: ./betterleaks git --redact --no-banner --verbose .
